apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"
// Copy vector icons font files to Android assets
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

import groovy.json.JsonSlurper

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

def envProperties = new Properties()
def envFile = rootProject.file("local.properties")
if (envFile.exists()) {
    envFile.withReader("UTF-8") { reader ->
        envProperties.load(reader)
    }
}
def mapsApiKey = project.env.get("MAPS_API_KEY") ?: envProperties.getProperty('MAPS_API_KEY', '')

project.ext.react = [
    enableHermes: true,  // explicitly enable Hermes
]

def patchAutolinkingCMake = {
    File autolinkingJson = rootProject.file("build/generated/autolinking/autolinking.json")
    File autolinkingCMake = file("$buildDir/generated/autolinking/src/main/jni/Android-autolinking.cmake")

    if (!autolinkingJson.exists() || !autolinkingCMake.exists()) {
        return
    }

    def model = new JsonSlurper().parse(autolinkingJson)
    def androidDependencies = (model.dependencies ?: [:]).values()
        .collect { it.platforms?.android }
        .findAll { it != null }

    def includeBlocks = androidDependencies.collectMany { dep ->
        def blocks = []
        def libraryName = dep.libraryName
        def cmakeListsPath = dep.cmakeListsPath
        def cxxModuleCMakeListsPath = dep.cxxModuleCMakeListsPath
        def cxxModuleName = dep.cxxModuleCMakeListsModuleName

        if (libraryName && cmakeListsPath) {
            def nativeFolderPath = cmakeListsPath.replace("CMakeLists.txt", "").replace(" ", "\\ ")
            blocks << """
if(EXISTS "${nativeFolderPath}")
  add_subdirectory("${nativeFolderPath}" ${libraryName}_autolinked_build)
  list(APPEND AUTOLINKED_LIBRARIES react_codegen_${libraryName})
endif()
""".stripIndent().trim()
        }

        if (cxxModuleCMakeListsPath) {
            def nativeFolderPath = cxxModuleCMakeListsPath.replace("CMakeLists.txt", "").replace(" ", "\\ ")
            def appendModuleLine = cxxModuleName ? "  list(APPEND AUTOLINKED_LIBRARIES ${cxxModuleName})\n" : ""
            blocks << """
if(EXISTS "${nativeFolderPath}")
  add_subdirectory("${nativeFolderPath}" ${libraryName}_cxxmodule_autolinked_build)
${appendModuleLine}endif()
""".stripIndent().trim()
        }

        return blocks
    }

    def patchedContent = """# This code was generated by [React Native](https://www.npmjs.com/package/@react-native/gradle-plugin)
cmake_minimum_required(VERSION 3.13)
set(CMAKE_VERBOSE_MAKEFILE on)

# We set REACTNATIVE_MERGED_SO so libraries/apps can selectively decide to depend on either libreactnative.so
# or link against a old prefab target (this is needed for React Native 0.76 on).
set(REACTNATIVE_MERGED_SO true)

set(AUTOLINKED_LIBRARIES)

${includeBlocks.join("\n\n")}
"""

    autolinkingCMake.write(patchedContent.stripIndent().trim() + "\n")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.liquid_spirit_mobile_app"
    defaultConfig {
        applicationId "com.liquid_spirit_mobile_app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 24
        versionName "2.2.1"

        // Force 64-bit only. This removes 32-bit/x86 native libs from the AAB,
        // which is required for Play's 16KB page-size compatibility checks.
        ndk {
            abiFilters "arm64-v8a"
        }
        
        buildConfigField "String", "AWS_ACCESS_KEY_ID", "\"${envProperties.getProperty('AWS_ACCESS_KEY_ID', '')}\""
        buildConfigField "String", "AWS_SECRET_ACCESS_KEY", "\"${envProperties.getProperty('AWS_SECRET_ACCESS_KEY', '')}\""
        buildConfigField "String", "AWS_REGION", "\"${envProperties.getProperty('AWS_REGION', '')}\""
        buildConfigField "String", "MAPS_API_KEY", "\"${mapsApiKey}\""
        manifestPlaceholders = [ MAPS_API_KEY: mapsApiKey ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(rootProject.file(MYAPP_RELEASE_STORE_FILE))
            storePassword MYAPP_RELEASE_STORE_PASSWORD
            keyAlias MYAPP_RELEASE_KEY_ALIAS
            keyPassword MYAPP_RELEASE_KEY_PASSWORD
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
        checkTestSources = false
        checkDependencies = false
    }
}
afterEvaluate {
    // Disable *all* lint-related tasks for this module
    tasks.matching { task ->
        task.name.toLowerCase().contains("lint")
    }.configureEach {
        enabled = false
    }

    tasks.matching { task ->
        task.name.startsWith("externalNativeBuildClean")
    }.configureEach {
        enabled = false
    }

    tasks.matching { task ->
        task.name == "generateAutolinkingNewArchitectureFiles"
    }.configureEach {
        doLast {
            patchAutolinkingCMake()
        }
    }

    tasks.matching { task ->
        task.name == "clean"
    }.configureEach {
        doFirst {
            delete(file("$projectDir/.cxx"))
        }
    }

    patchAutolinkingCMake()
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation 'com.google.android.gms:play-services-maps:18.1.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
